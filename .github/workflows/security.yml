name: Credential checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the secret scanner
        run: python3 -m unittest discover -s scripts -p 'test_check_secrets.py'
      - name: Check files and reachable commit history
        run: |
          scripts/check-secrets.sh --all
          scripts/check-secrets.sh --history --ref HEAD
